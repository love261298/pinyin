<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Học Pinyin Tiếng Trung</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center py-4">

  <div class="w-full max-w-xl mx-4">

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-4">

      <!-- Title -->
      <div class="text-center mb-2">
        <h1 class="text-2xl font-bold text-gray-800">
          🎲 Luyện Pinyin Tiếng Trung
        </h1>

        <p class="text-gray-500 mt-2">
          Chọn chế độ ôn tập, nhấn danh sách hoặc nhấn nút ngẫu nhiên
        </p>
      </div>

      <!-- Mode Selector -->
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2 text-center">Chế độ ôn tập:</label>
        <div class="grid grid-cols-3 gap-2 p-1 bg-gray-100 rounded-xl">
          <button id="modeThanhMau" onclick="changeMode('thanhMau')"
            class="py-2 px-3 rounded-lg text-sm font-bold transition-all bg-indigo-600 text-white shadow">
            Thanh Mẫu
          </button>
          <button id="modeVanMau" onclick="changeMode('vanMau')"
            class="py-2 px-3 rounded-lg text-sm font-bold transition-all text-gray-600 hover:text-indigo-600">
            Vận Mẫu
          </button>
          <button id="modeBoThu" onclick="changeMode('boThu')"
            class="py-2 px-3 rounded-lg text-sm font-bold transition-all text-gray-600 hover:text-indigo-600">
            214 Bộ Thủ
          </button>
          <button id="modeVocabulary" onclick="changeMode('vocabulary')"
            class="py-2 px-3 rounded-lg text-sm font-bold transition-all text-gray-600 hover:text-indigo-600">
            2500 Từ
          </button>
        </div>
      </div>

      <!-- Result Card -->
      <div
        class="relative bg-indigo-50 border-4 border-indigo-500 rounded-2xl mb-6 p-4 flex flex-col items-center justify-center min-h-[8.5rem] transition-all duration-200">

        <!-- Pinyin Display & Eye Icon -->
        <div class="flex items-center justify-center gap-4">
          <span id="result" class="text-5xl font-extrabold text-indigo-600 transition-all duration-200">
            ?
          </span>

          <!-- Eye Icon Button (Chỉ toggle cách đọc) -->
          <button id="togglePronunciationBtn" onclick="togglePronunciation()" title="Xem cách đọc"
            class="text-2xl text-indigo-400 hover:text-indigo-600 transition-colors focus:outline-none p-2">
            <i id="eyeIcon" class="fa-solid fa-eye"></i>
          </button>
        </div>

        <!-- Standalone Info (Luôn hiển thị khi có dữ liệu) -->
        <div id="standaloneText"
          class="mt-2 text-sm font-medium text-indigo-800 bg-indigo-100/90 px-3 py-1 rounded-full shadow-sm hidden">
        </div>

        <!-- Pronunciation Text (Chỉ bật/tắt khi nhấn icon con mắt) -->
        <div id="pronunciationText"
          class="mt-2 text-base font-semibold text-purple-700 bg-white/90 px-3 py-1 rounded-full shadow-sm hidden">
        </div>

      </div>

      <!-- Button -->
      <button id="randomButton" onclick="randomName()" class="w-full py-4 px-6
               bg-indigo-600 hover:bg-indigo-700
               active:scale-95
               text-white text-xl font-bold
               rounded-xl
               transition-all duration-200
               shadow-lg hover:shadow-xl">
        🎯 Chọn ngẫu nhiên
      </button>

      <!-- Name List -->
      <div class="mt-8">
        <h2 class="text-xl font-bold text-gray-700 mb-4 flex justify-between items-center">
          <span>👥 Danh sách ôn tập</span>
          <span id="itemCount" class="text-sm font-normal text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full"></span>
        </h2>

        <div id="nameList" class="grid grid-cols-4 gap-2 overflow-y-auto p-1 border rounded-xl max-h-[26rem]">
        </div>
      </div>

      "食": { pinyin: "shí", meaning: "ăn, thức ăn" },
      "首": { pinyin: "shǒu", meaning: "đầu" },
      "香": { pinyin: "xiāng", meaning: "thơm, hương" },

      "馬": { pinyin: "mǎ", meaning: "ngựa" },
      "骨": { pinyin: "gǔ", meaning: "xương" },
      "高": { pinyin: "gāo", meaning: "cao" },
      "髟": { pinyin: "biāo", meaning: "tóc dài" },
      "鬥": { pinyin: "dòu", meaning: "đấu, đánh nhau" },
      "鬯": { pinyin: "chàng", meaning: "rượu thơm" },
      "鬲": { pinyin: "gé", meaning: "nồi, cách ngăn" },
      "鬼": { pinyin: "guǐ", meaning: "ma, quỷ" },
      "魚": { pinyin: "yú", meaning: "cá" },
      "鳥": { pinyin: "niǎo", meaning: "chim" },
      "鹵": { pinyin: "lǔ", meaning: "muối, đất mặn" },
      "鹿": { pinyin: "lù", meaning: "hươu" },
      "麥": { pinyin: "mài", meaning: "lúa mạch" },
      "麻": { pinyin: "má", meaning: "cây gai" },
      "黃": { pinyin: "huáng", meaning: "vàng" },
      "黍": { pinyin: "shǔ", meaning: "kê" },
      "黑": { pinyin: "hēi", meaning: "đen" },
      "黹": { pinyin: "zhǐ", meaning: "thêu thùa" },
      "黽": { pinyin: "mǐn", meaning: "ếch, cóc" },
      "鼎": { pinyin: "dǐng", meaning: "đỉnh, vạc ba chân" },
      "鼓": { pinyin: "gǔ", meaning: "trống" },
      "鼠": { pinyin: "shǔ", meaning: "chuột" },
      "鼻": { pinyin: "bí", meaning: "mũi" },
      "齊": { pinyin: "qí", meaning: "đều, ngang bằng" },
      "齒": { pinyin: "chǐ", meaning: "răng" },
      "龍": { pinyin: "lóng", meaning: "rồng" },
      "龜": { pinyin: "guī", meaning: "rùa" },
      "龠": { pinyin: "yuè", meaning: "sáo, ống sáo" }
    };

    const vocabularyData = {

    }

    const thanhMau = Object.keys(thanhMauData);
    const vanMau = Object.keys(vanMauData);
    const boThu = Object.keys(boThuData);
    const vocabulary = Object.keys(vocabularyData);

    let currentMode = 'thanhMau';
    let activeList = [...thanhMau];
    let selectedItemKey = null;
    let isPronunciationVisible = false;

    // ==============================
    // DOM ELEMENTS
    // ==============================
    const result = document.getElementById("result");
    const nameList = document.getElementById("nameList");
    const itemCount = document.getElementById("itemCount");
    const pronunciationText = document.getElementById("pronunciationText");
    const standaloneText = document.getElementById("standaloneText");
    const eyeIcon = document.getElementById("eyeIcon");

    const modeThanhMauBtn = document.getElementById("modeThanhMau");
    const modeVanMauBtn = document.getElementById("modeVanMau");
    const modeBoThuBtn = document.getElementById("modeBoThu");
    const modeVocabularyBtn = document.getElementById("modeVocabulary");

    // ==============================
    // THAY ĐỔI CHẾ ĐỘ
    // ==============================
    function changeMode(mode) {
      currentMode = mode;

      if (mode === 'thanhMau') {
        activeList = [...thanhMau];
      } else if (mode === 'vanMau') {
        activeList = [...vanMau];
      } else if (mode === 'boThu') {
        activeList = [...boThu];
      } else if (mode === 'vocabulary'){
        activeList = [...vocabulary];
      }

      updateButtonStyles();
      resetResult();
      renderList();
    }

    function updateButtonStyles() {
      const activeClass = "bg-indigo-600 text-white shadow";
      const inactiveClass = "text-gray-600 hover:text-indigo-600 bg-transparent";

      modeThanhMauBtn.className = `py-2 px-3 rounded-lg text-sm font-bold transition-all ${currentMode === 'thanhMau' ? activeClass : inactiveClass}`;
      modeVanMauBtn.className = `py-2 px-3 rounded-lg text-sm font-bold transition-all ${currentMode === 'vanMau' ? activeClass : inactiveClass}`;
      modeBoThuBtn.className = `py-2 px-3 rounded-lg text-sm font-bold transition-all ${currentMode === 'boThu' ? activeClass : inactiveClass}`;
      modeVocabularyBtn.className = `py-2 px-3 rounded-lg text-sm font-bold transition-all ${currentMode === 'vocabulary' ? activeClass : inactiveClass}`;
    }

    function resetResult() {
      result.textContent = "?";
      selectedItemKey = null;
      hidePronunciation();
      updateStandaloneDisplay();
    }

    // ==============================
    // HIỂN THỊ DANH SÁCH & CHỌN MỤC
    // ==============================
    function renderList() {
      nameList.innerHTML = "";
      itemCount.textContent = `${activeList.length} từ`;

      activeList.forEach((itemText) => {
        const item = document.createElement("div");

        const isSelected = selectedItemKey === itemText;

        item.className = `
          p-2
          rounded-lg
          font-medium
          text-center
          transition-all
          duration-150
          text-sm
          cursor-pointer
          select-none
          ${isSelected
            ? 'bg-indigo-600 text-white font-bold shadow-md scale-105'
            : 'bg-gray-50 border border-gray-100 text-gray-700 hover:bg-indigo-100 hover:text-indigo-600 hover:scale-105'}
        `;
        item.textContent = itemText;

        // Sự kiện click chọn từ trong danh sách
        item.onclick = () => selectItem(itemText);

        nameList.appendChild(item);
      });
    }

    // Chọn từ trực tiếp từ danh sách hoặc nút random
    function selectItem(itemText) {
      selectedItemKey = itemText;
      result.textContent = selectedItemKey;

      hidePronunciation();
      updateStandaloneDisplay();
      renderList(); // Re-render để cập nhật trạng thái highlight

      // Hiệu ứng nảy kết quả
      result.classList.add("scale-110");
      setTimeout(() => {
        result.classList.remove("scale-110");
      }, 150);
    }

    // ==============================
    // RANDOM ITEM
    // ==============================
    function randomName() {
      if (activeList.length === 0) {
        result.textContent = "Trống";
        return;
      }

      const randomIndex = Math.floor(Math.random() * activeList.length);
      selectItem(activeList[randomIndex]);
    }

    function updateStandaloneDisplay() {
      if (!selectedItemKey) {
        standaloneText.classList.add("hidden");
        standaloneText.textContent = "";
        return;
      }

      const itemData =
        thanhMauData[selectedItemKey] ||
        vanMauData[selectedItemKey] ||
        boThuData[selectedItemKey];

      if (itemData && itemData.standalone) {
        standaloneText.textContent = `📝 Đứng độc lập: ${itemData.standalone}`;
        standaloneText.classList.remove("hidden");
      } else if (itemData && itemData.meaning) {
        standaloneText.textContent = `📖 Nghĩa: ${itemData.meaning}`;
        standaloneText.classList.remove("hidden");
      } else {
        standaloneText.classList.add("hidden");
        standaloneText.textContent = "";
      }
    }

    // ==============================
    // CÁCH ĐỌC & EYE ICON (TOGGLE CÁCH ĐỌC ONLY)
    // ==============================
    function togglePronunciation() {
      if (!selectedItemKey) return;

      if (isPronunciationVisible) {
        hidePronunciation();
      } else {
        showPronunciation();
      }
    }

    function showPronunciation() {
      if (!selectedItemKey) return;

      const itemData =
        thanhMauData[selectedItemKey] ||
        vanMauData[selectedItemKey] ||
        boThuData[selectedItemKey];

      if (itemData) {
        let text = "";

        if (itemData.read) {
          text = itemData.read;
        } else if (itemData.pinyin) {
          text = itemData.pinyin;
        }

        if (text) {
          pronunciationText.textContent = `🗣️ Đọc: ${text}`;
          pronunciationText.classList.remove("hidden");
          eyeIcon.className = "fa-solid fa-eye-slash";
          isPronunciationVisible = true;
        }
      }
    }

    function hidePronunciation() {
      pronunciationText.classList.add("hidden");
      pronunciationText.textContent = "";

      eyeIcon.className = "fa-solid fa-eye";
      isPronunciationVisible = false;
    }

    // Khởi tạo danh sách ban đầu
    renderList();
  </script>

</body>
