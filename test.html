<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Random Name</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">

  <div class="w-full max-w-xl mx-4">

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">

      <!-- Title -->
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800">
          🎲 Random Name
        </h1>

        <p class="text-gray-500 mt-2">
          Nhấn nút để chọn một người ngẫu nhiên
        </p>
      </div>


      <!-- Result -->
      <div id="result" class="h-32 flex items-center justify-center
               bg-indigo-50 border-4 border-indigo-500
               rounded-2xl mb-6
               text-4xl font-bold text-indigo-600">
        ?
      </div>


      <!-- Button -->
      <button id="randomButton" onclick="randomName()" class="w-full py-4 px-6
               bg-indigo-600 hover:bg-indigo-700
               active:scale-95
               text-white text-xl font-bold
               rounded-xl
               transition-all duration-200
               shadow-lg hover:shadow-xl">
        🎯 Chọn ngẫu nhiên
      </button>


      <!-- Name List -->
      <!-- <div class="mt-8">

        <h2 class="text-xl font-bold text-gray-700 mb-4">
          👥 Danh sách
        </h2>

        <div
          id="nameList"
          class="grid grid-cols-2 gap-3"
        >
        </div>

      </div> -->

    </div>

  </div>


  <script>

    // ==============================
    // DANH SÁCH TÊN
    // ==============================
    const thanhMau = [
      "b",
      "p",
      "m",
      "f",

      "d",
      "t",
      "n",
      "l",

      "g",
      "k",
      "h",

      "j",
      "q",
      "x",

      "zh",
      "ch",
      "sh",
      "r",

      "z",
      "c",
      "s"
    ];


    // ==============================
    // VẬN MẪU (韵母)
    // ==============================

    const vanMau = [
      "a",
      "o",
      "e",
      "i",
      "u",
      "ü",

      "ai",
      "ei",
      "ui",

      "ao",
      "ou",
      "iu",

      "ie",
      "üe",

      "er",

      "an",
      "en",
      "in",
      "un",
      "ün",

      "ang",
      "eng",
      "ing",
      "ong"
    ];

    const names = [...thanhMau];



    // ==============================
    // DOM ELEMENT
    // ==============================

    const result = document.getElementById("result");

    const nameList = document.getElementById("nameList");

    const randomButton = document.getElementById("randomButton");


    // ==============================
    // HIỂN THỊ DANH SÁCH
    // ==============================

    names.forEach((name, index) => {

      const item = document.createElement("div");

      item.className = `
        p-3
        bg-gray-100
        rounded-lg
        text-gray-700
        font-medium
        text-center
        hover:bg-indigo-100
        hover:text-indigo-600
        transition
      `;

      item.textContent = `${index + 1}. ${name}`;

      nameList.appendChild(item);

    });


    // ==============================
    // RANDOM NAME
    // ==============================

    function randomName() {

      // Không có tên
      if (names.length === 0) {
        result.textContent = "Không có tên";
        return;
      }


      // Random index
      const randomIndex = Math.floor(
        Math.random() * names.length
      );


      // Lấy tên
      const selectedName = names[randomIndex];


      // Hiển thị
      result.textContent = selectedName;


      // Hiệu ứng
      result.classList.add("scale-110");

      setTimeout(() => {

        result.classList.remove("scale-110");

      }, 200);

    }

  </script>

</body>

</html>
